name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: 1
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  KMP_DUPLICATE_LIB_OK: TRUE

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ruff
        run: python -m pip install ruff==0.12.0
      - name: Check style
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
        exclude:
          - os: windows-latest
            python-version: '3.10'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install the package
        run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest -m 'not slow' -q

  end-to-end:
    name: End-to-end on real sample data
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install the package
        run: python -m pip install -e ".[dev]"
      - name: Run the end-to-end tests
        run: pytest -m slow -q
      - name: Train two epochs on the bundled sample
        run: python scripts/train.py --config configs/sample.yaml --device cpu
      - name: Show the measured metrics
        run: cat outputs/sample/reports/metrics.json
      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: sample-run
          path: outputs/sample
          if-no-files-found: error
